# Checks the site, then deploys it to Cloudflare: on every push to main, and daily so Recent commits stays fresh.
# Nothing deploys unless every check passes, so a failed GitHub fetch leaves the live site on its last good version.
name: Check and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *" # 00:00 in Kuala Lumpur
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits rather than cancelling one mid-deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium
      # The E2E server runs pnpm build: type-check, then the build into dist/, which fetches from GitHub.
      - name: Type-check, build and E2E
        run: pnpm test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}

      # Fails the run if the built page misses the speed and size budget in lighthouserc.json.
      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.16.1 autorun

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
